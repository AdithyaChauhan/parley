# Production changes, laid on top of docker-compose.yml (D29, D30). On a server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# Compose reads both files; where they differ, this one wins. Nothing here is
# AWS-only, so it runs on any Linux server.

# Every long-running service: start again after a crash or a reboot (but not
# after a `docker stop`), and keep at most 3 log files of 10 MB each, so the
# logs can't fill the disk.
x-prod: &prod
  restart: unless-stopped
  logging: &logs
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # The helpers: no ports on the server at all. Only containers on Parley's
  # network can reach them, so the internet can't even try (D30).
  db:
    <<: *prod
    ports: !reset []

  redis:
    <<: *prod
    ports: !reset []

  rabbitmq:
    <<: *prod
    ports: !reset []

  # A one-shot job: it must stop once done, so no restart rule. Only the log limit.
  migrate:
    logging: *logs

  # The refresh cookie only travels over HTTPS now (D28, D30).
  backend_a:
    <<: *prod
    environment:
      COOKIE_SECURE: "true"

  backend_b:
    <<: *prod
    environment:
      COOKIE_SECURE: "true"

  worker:
    <<: *prod

  web:
    <<: *prod
    # Visitors use 80 and 443. Nginx isn't root, so inside the container it
    # listens on 8080 and 8443 (D27, D30). !override replaces the laptop's 8080.
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes:
      # The production config replaces the one baked into the image.
      - ./deploy/server/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # The certificate and key, written by certbot. Nginx only reads them.
      - letsencrypt:/etc/letsencrypt:ro
      # Where certbot leaves Let's Encrypt's check file, for Nginx to serve.
      - acme:/var/www/certbot:ro
    # Nginx as usual (exec: it stays the main program and gets `docker stop`'s
    # signal), plus a loop that reloads it every 6 hours, so a renewed
    # certificate is picked up with no restart and no dropped live lines.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]

  # Renews the certificate (D30). Twice a day it asks "is it due?" (within 30
  # days of running out). Usually the answer is no, and nothing happens. The
  # first certificate comes from deploy/server/first-cert.sh.
  certbot:
    <<: *prod
    image: certbot/certbot:v5.8.0
    profiles: [app]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/certbot
    # trap: exit at once on `docker stop`, instead of waiting out the sleep.
    # $$ is a plain $ (Compose would read $! as one of its own variables).
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"]

volumes:
  letsencrypt:
  acme:
