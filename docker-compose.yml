services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The whiteboard: fast, temporary facts like "Ana is online" (D22).
  # No volume on purpose: losing them on a restart is fine.
  redis:
    image: redis:8.10.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The post office for notification jobs (D25). Port 5672 is for programs,
  # 15672 is the web page (log in with the user and password below).
  rabbitmq:
    image: rabbitmq:4.3.7-management
    # RabbitMQ files its data under its own name, which comes from the
    # hostname. A fixed one means it finds its old data after a rebuild.
    hostname: parley-rabbitmq
    environment:
      # The built-in guest user only works inside the container, so make our own.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    # Unlike Redis, a volume: parked jobs in notify.failed must survive
    # `docker compose down`.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Healthy only once the port takes connections, not just when it's booting.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  db_data:
  rabbitmq_data:
