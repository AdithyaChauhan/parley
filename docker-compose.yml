# `docker compose up` starts only the helpers (db, redis, rabbitmq), for dev
# with uvicorn and Vite on the laptop. `docker compose --profile app up --build`
# also starts Parley itself, at http://localhost:8080 (D27).

# Shared by the backend copies, worker and migrate: one image, three commands (D27).
# `<<: *parley-backend` below pastes this block into each of them.
x-parley-backend: &parley-backend
  build: ./backend
  image: parley-backend
  profiles: [app]
  # Secrets come in at run time, never inside the image (D27).
  env_file: .env
  # Inside Parley's network the helpers are reached by their service names,
  # not 127.0.0.1. These replace the laptop addresses from .env.
  # Named on its own (&parley-env): `<<:` only pastes one level deep, so a copy
  # that adds COPY_NAME must paste these back in, or it would lose them.
  environment: &parley-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F

# Shared by the two backend copies (D28): the same image, waits and health
# check. They differ only in COPY_NAME.
x-parley-copy: &parley-copy
  <<: *parley-backend
  # The image's own command: uvicorn on port 8000. No `ports:` on purpose,
  # so only containers on Parley's network can reach it (D27).
  depends_on:
    migrate:
      condition: service_completed_successfully
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    # Slim has no curl, so ask with Python. A non-2xx answer or no answer fails.
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
    interval: 5s
    timeout: 5s
    retries: 10
  # `docker stop` waits this long for a clean shutdown before forcing it.
  # uvicorn closes the live lines at once (1012), so it rarely needs it (D28).
  stop_grace_period: 10s

services:
  db:
    # An exact patch: patches keep the same data format (D27).
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The whiteboard: fast, temporary facts like "Ana is online" (D22).
  # No volume on purpose: losing them on a restart is fine.
  redis:
    image: redis:8.10.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The post office for notification jobs (D25). Port 5672 is for programs,
  # 15672 is the web page (log in with the user and password below).
  rabbitmq:
    image: rabbitmq:4.3.7-management
    # RabbitMQ files its data under its own name, which comes from the
    # hostname. A fixed one means it finds its old data after a rebuild.
    hostname: parley-rabbitmq
    environment:
      # The built-in guest user only works inside the container, so make our own.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    # Unlike Redis, a volume: parked jobs in notify.failed must survive
    # `docker compose down`.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Healthy only once the port takes connections, not just when it's booting.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10

  # Brings the database tables up to date once, then exits. The others wait
  # for it, so the two copies never migrate at the same time (D27).
  migrate:
    <<: *parley-backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Two copies of the backend behind Nginx (D28). Any request or live line can
  # go to either: what they share lives in PostgreSQL and Redis, not in a copy.
  backend_a:
    <<: *parley-copy
    environment:
      <<: *parley-env
      COPY_NAME: A

  backend_b:
    <<: *parley-copy
    environment:
      <<: *parley-env
      COPY_NAME: B

  worker:
    <<: *parley-backend
    command: ["python", "-m", "app.notify.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Room to hand the job in progress back to RabbitMQ (D25, D27).
    stop_grace_period: 15s

  # Nginx: the built app, plus /api and the live line spread across both copies.
  web:
    build: ./frontend
    image: parley-web
    profiles: [app]
    ports:
      - "8080:8080"
    depends_on:
      backend_a:
        condition: service_healthy
      backend_b:
        condition: service_healthy

volumes:
  db_data:
  rabbitmq_data:
