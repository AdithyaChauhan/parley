# `docker compose up` starts only the helpers (db, redis, rabbitmq), for dev
# with uvicorn and Vite on the laptop. `docker compose --profile app up --build`
# also starts Parley itself, at http://localhost:8080 (D27). Add
# `--profile monitoring` for Prometheus and Grafana, at http://localhost:3000 (D32).

# Shared by the backend copies, worker and migrate: one image, three commands (D27).
# `<<: *parley-backend` below pastes this block into each of them.
x-parley-backend: &parley-backend
  build: ./backend
  image: parley-backend
  profiles: [app]
  # Secrets come in at run time, never inside the image (D27).
  env_file: .env
  # Inside Parley's network the helpers are reached by their service names,
  # not 127.0.0.1. These replace the laptop addresses from .env.
  # Named on its own (&parley-env): `<<:` only pastes one level deep, so a copy
  # that adds COPY_NAME must paste these back in, or it would lose them.
  environment: &parley-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F

# Shared by the two backend copies (D28): the same image, waits and health
# check. They differ only in COPY_NAME.
x-parley-copy: &parley-copy
  <<: *parley-backend
  # The image's own command: uvicorn on port 8000. No `ports:` on purpose,
  # so only containers on Parley's network can reach it (D27).
  depends_on:
    migrate:
      condition: service_completed_successfully
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    # Slim has no curl, so ask with Python. A non-2xx answer or no answer fails.
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
    # Every check starts a fresh Python, which costs CPU: every 5 s, each copy
    # used ~3.7% of the server around the clock (T29). So every 1 s while
    # starting (a deploy sees "healthy" quickly, D31), then every 30 s.
    interval: 30s
    timeout: 5s
    retries: 10
    start_period: 30s
    start_interval: 1s
  # `docker stop` waits this long for a clean shutdown before forcing it.
  # uvicorn closes the live lines at once (1012), so it rarely needs it (D28).
  stop_grace_period: 10s

services:
  db:
    # An exact patch: patches keep the same data format (D27).
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The whiteboard: fast, temporary facts like "Ana is online" (D22).
  # No volume on purpose: losing them on a restart is fine.
  redis:
    image: redis:8.10.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The post office for notification jobs (D25). Port 5672 is for programs,
  # 15672 is the web page (log in with the user and password below).
  rabbitmq:
    image: rabbitmq:4.3.7-management
    # RabbitMQ files its data under its own name, which comes from the
    # hostname. A fixed one means it finds its old data after a rebuild.
    hostname: parley-rabbitmq
    environment:
      # The built-in guest user only works inside the container, so make our own.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    # Unlike Redis, a volume: parked jobs in notify.failed must survive
    # `docker compose down`.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Healthy only once the port takes connections, not just when it's booting.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      # Every check starts a whole Erlang program (about a second): every 5 s,
      # that was ~9% of the server around the clock (T29). So every 2 s while
      # starting, then every 30 s.
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 2s

  # Brings the database tables up to date once, then exits. The others wait
  # for it, so the two copies never migrate at the same time (D27).
  migrate:
    <<: *parley-backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Two copies of the backend behind Nginx (D28). Any request or live line can
  # go to either: what they share lives in PostgreSQL and Redis, not in a copy.
  backend_a:
    <<: *parley-copy
    environment:
      <<: *parley-env
      COPY_NAME: A

  backend_b:
    <<: *parley-copy
    environment:
      <<: *parley-env
      COPY_NAME: B

  worker:
    <<: *parley-backend
    command: ["python", "-m", "app.notify.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Room to hand the job in progress back to RabbitMQ (D25, D27).
    stop_grace_period: 15s

  # Nginx: the built app, plus /api and the live line spread across both copies.
  web:
    build: ./frontend
    image: parley-web
    profiles: [app]
    ports:
      - "8080:8080"
    depends_on:
      backend_a:
        condition: service_healthy
      backend_b:
        condition: service_healthy

  # ---- Monitoring (D32): only with --profile monitoring. ----
  # No health checks: nothing waits on these (like worker and web, D27).
  # No ports except Grafana's, and that one only on this machine.

  # Asks every part for its numbers every 15 s, and keeps them for 7 days.
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    command:
      # The image's own two settings, plus the 7 days.
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # A volume, so the 7 days survive a restart.
      - prometheus_data:/prometheus

  # Draws the dashboard. Its data source and the dashboard are files in the
  # repo, so it sets itself up on any machine.
  grafana:
    image: grafana/grafana:13.2.5
    profiles: [monitoring]
    ports:
      # 127.0.0.1: only this machine can open it, never the network (D32).
      - "127.0.0.1:3000:3000"
    environment:
      # Log in as admin with GRAFANA_ADMIN_PASSWORD from .env. Blank is allowed
      # here, so the server's deploys (whose .env has none) keep working...
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      # The Parley dashboard is the first thing you see after logging in.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/parley.json
      # Otherwise Grafana downloads and updates ~18 plugins we don't use (Loki,
      # Tempo, MySQL ...) from the internet on every start: unpinned (D27) and
      # slow. The Prometheus data source is built in.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    # ...but Grafana itself refuses to start without one, so it's never admin/admin.
    # $$ is a plain $ (Compose would read it as one of its own variables).
    entrypoint: ["/bin/sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'Set GRAFANA_ADMIN_PASSWORD in .env' >&2; exit 1; }; exec /run.sh"]
    # No volume: Grafana starts fresh each time, from the files. So the
    # password in .env always applies, and nothing clicked can drift.
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

  # The exporters: small programs that read a helper's numbers and show them
  # as a /metrics page. The app's own Postgres user (4A at the T30 pre-check):
  # the exporter only reads stats.
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}

  redis_exporter:
    image: oliver006/redis_exporter:v1.93.0
    profiles: [monitoring]
    environment:
      REDIS_ADDR: redis://redis:6379

  # CPU and memory per container. It reads them from the machine itself, so it
  # gets read-only views of the machine's folders.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [monitoring]
    command:
      # Only containers, every 15 s (like Prometheus), and only CPU and memory:
      # the rest costs CPU and memory of its own.
      - --docker_only=true
      - --housekeeping_interval=15s
      - --enable_metrics=cpu,memory
      # Just the Compose project and service as labels (parley, backend_a ...),
      # not every label Docker has on a container.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  db_data:
  rabbitmq_data:
  prometheus_data:
