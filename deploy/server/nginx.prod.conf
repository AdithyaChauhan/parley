# Parley's front door on a server, with HTTPS (D30). Mounted over the image's
# own config by docker-compose.prod.yml. Nginx isn't root (D27), so it listens
# on 8080 and 8443, and the server maps 80 -> 8080 and 443 -> 8443.
# The parts below the "same as" line match frontend/nginx.conf (T25, T26).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A new backend container gets a new address. Ask Docker's name service again
# every 10 s (D27).
resolver 127.0.0.11 valid=10s;

# The two backend copies (D28), as in frontend/nginx.conf.
upstream backends {
    zone backends 64k;
    least_conn;
    server backend_a:8000 resolve max_fails=1 fail_timeout=10s;
    server backend_b:8000 resolve max_fails=1 fail_timeout=10s;
}

# Port 80 (plain http): only two jobs.
server {
    listen 8080;

    # 1. Let's Encrypt's check: certbot leaves a file here, and Let's Encrypt
    #    fetches it from the internet to prove we own the domain.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 2. Everything else: "use https instead" (301 = moved for good). The app
    #    itself is never served over plain http.
    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 (https): Parley itself.
server {
    listen 8443 ssl;

    # The certificate (fullchain = ours plus Let's Encrypt's) and its private
    # key. The fixed name "parley" (certbot --cert-name) keeps this file the
    # same on any server and domain. A certbot deploy hook lets Nginx's group
    # read the key (D30).
    ssl_certificate     /etc/letsencrypt/live/parley/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parley/privkey.pem;

    # Only TLS 1.2 and 1.3: the older versions have known holes.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Remember finished handshakes for a while, so a returning browser (or a
    # reconnecting live line) skips the slow part.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- same as frontend/nginx.conf from here ----

    root /usr/share/nginx/html;

    # Any address that isn't a real file gets index.html, so React's router
    # can show /login after a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser always checks for a newer service worker (D26).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backends;
        # A copy that doesn't pick up within 2 s counts as dead (D28).
        proxy_connect_timeout 2s;
        # Try the other copy only if the request never got through (D28).
        proxy_next_upstream error timeout;
        # WebSocket for the live line (/api/live).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The browser's real IP, overwritten so a client can't fake it (D27).
        proxy_set_header X-Forwarded-For $remote_addr;
        # The app pings every 25 s (D21), so 60 s leaves plenty of room.
        proxy_read_timeout 60s;
    }
}
