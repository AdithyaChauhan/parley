# Garage, Parley's file store (D38). One node, so one copy of each file.
# No secrets here: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN come from the environment.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# sqlite: light on memory, which is what we picked Garage for.
db_engine = "sqlite"
replication_factor = 1
# Photos and zips are already compressed. Trying again only costs CPU.
compression_level = "none"

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
