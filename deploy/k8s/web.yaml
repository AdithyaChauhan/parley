# The front door, as in Compose and production (D35): Nginx hands out the built
# app and passes /api and the live line on to the backends. No ingress controller.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    stage: app
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      # kind-config.yaml maps this to http://localhost:8090.
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    stage: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      enableServiceLinks: false
      # Nginx's polite stop waits for open connections, and a live line stays
      # open for hours. So cap it: the apps reconnect to the new pod (D21).
      terminationGracePeriodSeconds: 10
      containers:
        - name: web
          image: parley-web:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          volumeMounts:
            # Replaces the image's default.conf with the Kubernetes version.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          # A stopping pod leaves the routing rules a moment after it's told to stop.
          # Without this pause, asks in that moment failed (3 in 1 s during a roll).
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          # The built app's front page: no backend behind it, so a backend
          # problem never takes the front door down.
          startupProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          # Patient, like the backend's: a restart here drops every live line.
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits: { cpu: 500m, memory: 64Mi }
      volumes:
        - name: nginx-conf
          configMap:
            name: web-nginx
