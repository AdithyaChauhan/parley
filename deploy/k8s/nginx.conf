# Parley's front door on Kubernetes (D35). The same job as frontend/nginx.conf,
# but it finds the backends through the cluster's name service.

# See frontend/nginx.conf: pass the live line's WebSocket upgrade on.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The cluster's name service. A rolled pod has a new address, so ask again
# every 5 s, instead of trusting the 30 s the answer says it's good for.
resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

# One name, one address per ready backend pod (the headless Service in
# backend.yaml). `resolve` keeps the list current; the rest is D28's setup.
upstream backends {
    zone backends 64k;
    least_conn;
    server backend.parley.svc.cluster.local:8000 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backends;
        proxy_connect_timeout 2s;
        # Try another pod after a connection error or a timeout, but never
        # repeat a POST that already reached one (D28).
        proxy_next_upstream error timeout;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The real IP for the rate limits (D24, D27).
        proxy_set_header X-Forwarded-For $remote_addr;
        # The app pings every 25 s (D21), so a quiet line is safe for this long.
        proxy_read_timeout 60s;
    }
}
