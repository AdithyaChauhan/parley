# Parley's front door on Kubernetes (D35). The same job as frontend/nginx.conf,
# but it finds the backends through the cluster's name service.

# See frontend/nginx.conf: pass the live line's WebSocket upgrade on.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The cluster's name service. A rolled pod has a new address, so ask again
# every 5 s, instead of trusting the 30 s the answer says it's good for.
resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

# One name, one address per ready backend pod (the headless Service in
# backend.yaml). `resolve` keeps the list current; the rest is D28's setup.
upstream backends {
    zone backends 64k;
    least_conn;
    server backend.parley.svc.cluster.local:8000 resolve max_fails=1 fail_timeout=10s;
}

# The file store (D38).
upstream store {
    zone store 64k;
    server storage.parley.svc.cluster.local:3900 resolve;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Files go straight between the browser and the store (D38). The signature
    # covers the store's own address, so that's the Host it must see. The URL
    # is the only permission: Nginx adds none and checks none.
    location /storage/ {
        limit_except GET PUT { deny all; }
        proxy_pass http://store/;
        proxy_set_header Host storage:3900;
        proxy_connect_timeout 2s;
        # Files are passed through, never written to Nginx's disk first.
        proxy_request_buffering off;
        proxy_buffering off;
        # 10 MB plus room. The real limit is the size signed into the URL.
        client_max_body_size 11m;
        # A slow phone may take a while to send 10 MB.
        client_body_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # A file must never act as a page on our site.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    }

    location /api/ {
        proxy_pass http://backends;
        proxy_connect_timeout 2s;
        # Try another pod after a connection error or a timeout, but never
        # repeat a POST that already reached one (D28).
        proxy_next_upstream error timeout;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The real IP for the rate limits (D24, D27).
        proxy_set_header X-Forwarded-For $remote_addr;
        # The app pings every 25 s (D21), so a quiet line is safe for this long.
        proxy_read_timeout 60s;
    }
}
