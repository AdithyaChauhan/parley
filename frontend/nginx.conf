# Parley's front door (D27): hands out the built app and passes /api on to the
# backend, like the Vite proxy does in dev (D17). Replaces Nginx's default site.

# The live line asks to switch to a WebSocket with "Upgrade: websocket".
# Pass that on as "Connection: upgrade"; normal requests get "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A new backend container gets a new address. Ask Docker's name service
# (always 127.0.0.11) again every 10 s instead of only once at start (D27).
resolver 127.0.0.11 valid=10s;

# The two backend copies (D28). Port 8000 is only open inside Parley's
# network, never on the laptop.
upstream backends {
    # Shared memory for the addresses found by `resolve`, so every Nginx
    # worker sees the same list.
    zone backends 64k;
    # The next request or live line goes to the copy with fewer open
    # connections. That suits live lines, which stay open for hours.
    least_conn;
    # resolve: look the name up again (every 10 s, see resolver), and start
    # even if a copy is missing. max_fails=1 fail_timeout=10s: one failed try
    # and that copy is skipped for 10 s.
    server backend_a:8000 resolve max_fails=1 fail_timeout=10s;
    server backend_b:8000 resolve max_fails=1 fail_timeout=10s;
}

server {
    # 8080, not 80: Nginx runs as a normal user, and only root may use ports below 1024.
    listen 8080;
    root /usr/share/nginx/html;

    # Any address that isn't a real file gets index.html, so React's router
    # can show /login after a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser always checks for a newer service worker (D26).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backends;
        # A copy that doesn't pick up within 2 s counts as dead, and the
        # request goes to the other one.
        proxy_connect_timeout 2s;
        # Try the other copy after a connection error or a timeout. Nginx
        # never repeats a POST that already reached a copy (no
        # "non_idempotent" here): a log-in or refresh twice could clash with
        # token rotation. A POST that never got through is still tried on the
        # other copy (D28).
        proxy_next_upstream error timeout;
        # WebSocket for the live line (/api/live).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The browser's real IP, for the rate limits (D24). Overwritten, not
        # added to, so a client can't fake it with its own X-Forwarded-For (D27).
        proxy_set_header X-Forwarded-For $remote_addr;
        # A quiet live line is closed after this long. The app pings every
        # 25 s (D21), so 60 s leaves plenty of room.
        proxy_read_timeout 60s;
    }
}
