# Runs the checks on every pull request to main and every push to main.
# A green tick on the PR means both jobs passed.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # A live test waiting for an event that never comes would wait forever.
    # Stop a stuck run after 10 minutes instead of GitHub's 6 hours.
    timeout-minutes: 10

    # A throwaway Postgres and Redis just for this run, deleted when the job ends.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: parley_test
          POSTGRES_USER: parley
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U parley -d parley_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.7-management
        env:
          RABBITMQ_DEFAULT_USER: parley
          RABBITMQ_DEFAULT_PASS: ci-only-password
          # Made at first start, so the tests' parley_test vhost exists (D25).
          RABBITMQ_DEFAULT_VHOST: parley_test
        ports:
          - 5672:5672
        # Healthy only once the port takes connections, not just when it's booting.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    # The runner has no .env. These values are fake and only work inside
    # this throwaway run, so they are safe to commit.
    env:
      DATABASE_URL: postgresql+psycopg://parley:ci-only-password@localhost:5432/parley_test
      TEST_DATABASE_URL: postgresql+psycopg://parley:ci-only-password@localhost:5432/parley_test
      JWT_SECRET: ci-only-fake-secret-never-used-anywhere-real-0123456789
      # Database 15: the tests refuse any other number (D22).
      REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_URL: redis://localhost:6379/15
      # The parley_test vhost: the tests refuse any other (D25).
      RABBITMQ_URL: amqp://parley:ci-only-password@localhost:5672/parley_test
      TEST_RABBITMQ_URL: amqp://parley:ci-only-password@localhost:5672/parley_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Build the sheets in the empty test database.
      - run: alembic upgrade head

      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
