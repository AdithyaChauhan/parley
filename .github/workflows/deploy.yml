# Puts main live on the AWS server (D31). After CI passes on main: build both
# images tagged with the commit, push them to ECR, and run the parley-deploy
# SSM document on the server. Run it by hand with an older tag to roll back.
# GitHub stores no AWS keys: only the variables below (Settings > Variables).
name: Deploy

on:
  # Starts when the CI workflow finishes on main. The job below checks it passed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # The rollback: Actions > Deploy > Run workflow, with a version already in ECR.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to put live: a commit id already in ECR (e.g. 95196b3)"
        required: true

permissions:
  contents: read
  # Lets the run ask GitHub for its signed ID card (OIDC), which AWS checks.
  id-token: write

# One deploy at a time. A second one waits instead of cutting the first off
# halfway (D31).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only a green CI run caused by a push to main (not a pull request), or a
    # run started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      SITE_URL: ${{ vars.SITE_URL }}

    steps:
      # The version: the commit CI tested, or the tag typed in by hand. Passed
      # through env, never pasted into the script, so a typed tag can't run
      # as a command.
      - name: Pick the version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then TAG="$INPUT_TAG"; else TAG="${HEAD_SHA::7}"; fi
          [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]] || { echo "Not a commit id: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Deploying $TAG"

      # The exact commit CI tested, not whatever main is by now.
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # OIDC: GitHub's ID card in, a role that lasts an hour out (D31).
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

      # Tags can't be overwritten (D31), so a version already in ECR is kept
      # as it is (a re-run). A rollback never builds: its images must be there.
      - name: Build and push the images
        env:
          # Plain single images, without the extra side files that would count
          # toward ECR's "keep the last 10".
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          EVENT: ${{ github.event_name }}
        run: |
          for name in backend web; do
            if aws ecr describe-images --repository-name "parley-$name" --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
              echo "parley-$name:$TAG is already in ECR"
              continue
            fi
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "parley-$name:$TAG isn't in ECR. A rollback can only use one of the last 10 versions."
              exit 1
            fi
            docker build --build-arg "APP_VERSION=$TAG" -t "$REGISTRY/parley-$name:$TAG" "./$name"
            docker push "$REGISTRY/parley-$name:$TAG"
          done

      # The only command this role may run, on the only server it may reach (D31).
      - name: Deploy on the server
        run: |
          ID=$(aws ssm send-command --document-name parley-deploy --instance-ids "$INSTANCE_ID" \
            --parameters "tag=$TAG" --comment "GitHub run $GITHUB_RUN_ID" \
            --query Command.CommandId --output text)
          echo "SSM command $ID"
          while :; do
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Result: $STATUS"
          [ "$STATUS" = Success ]

      # Through the internet, like a browser: all 10 answers must carry the new
      # version, and both copies must answer (D28).
      - name: Check the live site
        run: |
          for i in $(seq 1 10); do
            curl --fail --silent --show-error "$SITE_URL/api/health"
            echo
          done > answers.txt
          cat answers.txt
          [ "$(grep -c "\"version\":\"$TAG\"" answers.txt)" -eq 10 ]
          grep -q '"copy":"A"' answers.txt
          grep -q '"copy":"B"' answers.txt
